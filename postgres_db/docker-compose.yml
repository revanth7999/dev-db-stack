version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: dinemaster-postgres-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Root@1234
      POSTGRES_DB: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - my_shared_network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  my_shared_network:
    external: true